<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <script>
    // Second layer of the Windows-only gate in worker/index.js: catches browsers
    // that spoof a Windows User-Agent header but still report their real platform.
    (function () {
      try {
        var d = navigator.userAgentData;
        var bad = d ? (d.mobile || d.platform !== "Windows") : !/^Win/.test(navigator.platform || "");
        if (bad) location.replace("/__denied");
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/png" href="/avlokai_logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Venkateswara Polymers — Inventory & Production Management System" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <title>Venkateswara Polymers — IMS</title>
</head>

</body>
